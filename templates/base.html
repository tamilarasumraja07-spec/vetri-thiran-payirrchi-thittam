<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        PocketSmart AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >
</head>

<body>

<header class="navbar">

    <a
        href="/"
        class="brand"
    >
        PocketSmart AI
    </a>

    <nav>

        <a href="/">Home</a>

        <a href="/planner/home">
            Home Interior
        </a>

        <a href="/planner/party">
            Party
        </a>

        <a href="/planner/jewelry">
            Jewelry
        </a>

        <a href="/testimonials">
            Testimonials
        </a>

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/login">
            Login
        </a>

        <a href="/register">
            Register
        </a>

    </nav>

</header>


<main class="page-container">

    {% block content %}
    {% endblock %}

</main>


<footer class="footer">

    <div>
        <strong>PocketSmart AI</strong>
        <p>
            Smart budgeting and recommendations
            powered by Generative AI.
        </p>
    </div>

    <div>
        <p>
            © 2026 PocketSmart AI
        </p>
    </div>

</footer>


<script
    src="{{ url_for('static', path='js/app.js') }}"
></script>

{% block scripts %}
{% endblock %}

</body>
</html>
